version: 2.1

jobs:
  build:
    working_directory: ~/ExampleApplication
    docker:
      - image: circleci/node:10.16.3
    steps:
      - checkout
      - run:
          name: update-npm
          command: sudo npm install -g npm@5
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: install-npm
          command: npm install
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules

  deploy:
    docker:
      - image: circleci/node:10.16.3
    steps:
      - run:
          name: deploy-application
          command: |
            ssh -o StrictHostKeyChecking=no \
            $EC2_USERNAME@ec2-50-17-31-66.compute-1.amazonaws.com "
              rm -rf ExampleApplication;
              git clone https://github.com/Soumya-RKumar/ExampleApplication.git;
              source ExampleApplication/deploy.sh
            "

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main

      - deploy:
          requires:
            - build